server:
  port: 8083 # run on port 8083

spring:
  application:
    name: alpex-golden-copy-service

  #  CONNECTION (PostgreSQL run port 5433)
  datasource:
    url: jdbc:postgresql://alpex-postgres-db:5432/${POSTGRES_DB_NAME}
    username: ${POSTGRES_ADMIN_USER}
    password: ${POSTGRES_ADMIN_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #  HIBERNATE / JPA CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  #  KAFKA CONFIGURATION
  kafka:
    bootstrap-servers: alpex-kafka-broker:2181
    consumer:
      group-id: alpex-golden-copy-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: java.util.Map
