server:
  port: 8083 # run on port 8083

spring:
  application:
    name: alpex-golden-copy-service

  #  CONNECTION (PostgreSQL run port 5433)
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB_NAME}
    username: ${POSTGRES_ADMIN_USER}
    password: ${POSTGRES_ADMIN_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #  HIBERNATE / JPA CONFIGURATION
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false #  console clean

  #  KAFKA CONFIGURATION
  kafka:
    bootstrap-servers: localhost:9092
