services:
  # Capa de Almacenamiento
  postgres-db:
    image: postgres:16.4-alpine
    container_name: alpex-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: Europe/Zurich
    ports:
      - "5433:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    networks:
      - alpex-production-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Capa de Mensajería: Apache Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: alpex-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: Europe/Zurich
    networks:
      - alpex-production-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alpex-kafka-broker
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:2181,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TZ: Europe/Zurich
    networks:
      - alpex-production-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MICROSERVICIOS JAVA (Compilación Automática en la Nube)
  ingestion-service:
    build: ./ingestion-service
    container_name: alpex-ingestion-service
    restart: always
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      - MARKET_API_KEY=${MARKET_API_KEY}
    networks:
      - alpex-production-network

  validation-service:
    build: ./validation-service
    container_name: alpex-validation-service
    restart: always
    depends_on:
      - kafka
    networks:
      - alpex-production-network

  golden-copy-service:
    build: ./golden-copy-service
    container_name: alpex-golden-copy-service
    restart: always
    depends_on:
      - postgres-db
      - kafka
    networks:
      - alpex-production-network

volumes:
  postgres_production_data:
    driver: local

networks:
  alpex-production-network:
    driver: bridge
